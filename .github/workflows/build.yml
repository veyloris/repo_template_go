name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      # Replace this Azure-specific block with whatever registry login you need
      # (docker/login-action for Docker Hub, aws-actions/configure-aws-credentials
      # for ECR, docker/login-action targeting ghcr.io for GHCR, etc.)
      - name: Azure Login (OIDC)
        uses: veyloris/.github/actions/azure-oidc-login@main
        with:
          client-id: ${{ secrets.AZURE_SHARED_ACR_CLIENT_ID }}
          tenant-id: ${{ vars.DAFT_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.DAFT_AZURE_SUBSCRIPTION_ID }}

      - name: Build, Scan & Push
        uses: veyloris/.github/actions/acr-build-scan-push@main
        with:
          image-name: myapp
          acr-registry: ${{ vars.ACR_REGISTRY_NPE }}
          build-args: |
            COMMIT=${{ github.sha }}
