name: Validate

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Rapid successive pushes to the same PR supersede each other; cancel the
# stale run instead of paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Split by runner capability:
  #  - validate: build/vet/lint + unit tests (-short skips docker-dependent
  #    testcontainers suites). Safe to move to restricted self-hosted runners
  #    (e.g. Kubernetes-mode ARC, no docker socket) to save hosted minutes.
  #  - integration: the full suite including testcontainers, which needs
  #    Docker; keep on a docker-capable runner.
  # With no integration tests yet the second job is a cheap no-op superset;
  # it earns its keep the day the first testcontainers suite lands.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Full test suite (testcontainers)
        run: go test -race ./...
