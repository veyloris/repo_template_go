# Zizmor configuration, enforced in CI by .github/workflows/security.yml.
#
# Action pinning policy (see SECURITY.md, "CI/CD Supply Chain"):
# all actions MUST be pinned to a full commit SHA (hash-pin). This template
# uses no org-internal reusable workflows, so no ref-pin exceptions exist.
# If your org adds reusable workflows inside its own trust boundary, add a
# `yourorg/*: ref-pin` policy and record the rationale in SECURITY.md.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
