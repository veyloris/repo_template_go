version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - dupl
          - errcheck
          - gosec
          - noctx
      # Generated code (e.g. sqlc output): regenerate, never hand-edit or
      # hand-lint. Uncomment and point at the generated dir when one exists.
      # - path: internal/store/storegen/
      #   linters:
      #     - govet
      #     - revive
      #     - gocritic
      #     - gosec
      #     - errcheck
      #     - errorlint
      #     - unconvert

formatters:
  enable:
    - gofmt
    - goimports
