exclude: |
  (?x)^(
      \.history/.*|
      .*cache.*/.*|
  )$
fail_fast: true
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  # ----------------------------- Security Tools ----------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: "security - Detect hardcoded secrets"

  # ------------------------------ Go Quality ------------------------------- #

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        name: "go - Lint with golangci-lint"
        # Pin to the toolchain in go.mod so the locally-built linter binary
        # is built with a Go new enough to load the project's Go version.
        language_version: "1.26.2"

  - repo: local
    hooks:
      - id: go-fmt
        name: "go - Format with gofmt"
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true
      - id: go-mod-tidy
        name: "go - Tidy go.mod"
        entry: go mod tidy
        language: system
        files: '(go\.mod|go\.sum)$'
        pass_filenames: false

  # ------------------------- Data & Config Validation ----------------------- #

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.1
    hooks:
      - id: check-github-workflows
        name: "github-actions - Validate gh workflow files"
        args: ["--verbose"]
      - id: check-taskfile
        name: "taskfile - Validate Task configuration"

  # --------------------------------- Shell ---------------------------------- #

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "shell - Lint shell scripts"

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        name: "shell - Check shell script code style"

  # ----------------------------- Filesystem / Git --------------------------- #

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        name: "filesystem - Verify shebang presence"
      - id: check-shebang-scripts-are-executable
        name: "filesystem - Verify script permissions"
      - id: check-case-conflict
        name: "filesystem - Check case sensitivity"
      - id: check-illegal-windows-names
        name: "filesystem - Validate Windows filenames"
      - id: check-symlinks
        name: "filesystem - Check symlink validity"
      - id: destroyed-symlinks
        name: "filesystem - Detect broken symlinks"
      - id: check-merge-conflict
        name: "git - Detect conflict markers"
      - id: forbid-new-submodules
        name: "git - Prevent submodule creation"
      - id: no-commit-to-branch
        name: "git - Protect main branches"
        args: ["--branch", "main", "--branch", "master"]
      - id: check-added-large-files
        name: "git - Block large file commits"
        args: ["--maxkb=5000"]
